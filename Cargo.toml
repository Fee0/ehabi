[package]
name = "ehabi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A library for reading and writing the Arm EHABI exception tables (.ARM.exidx and .ARM.extab)."
repository = "https://github.com/Fee0/ehabi"
license = "MIT"
keywords = ["arm", "ehabi", "unwind", "exidx", "elf"]
categories = ["development-tools::debugging", "parser-implementations", "no-std"]
readme = "README.md"
include = [
    "/src",
    "/examples",
    "/tests/elf/mod.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["read", "write", "unwinder"]
# Reading `.ARM.exidx` / `.ARM.extab`.
read = []
# Writing `.ARM.exidx` / `.ARM.extab`.
write = []
# The virtual unwinder.
unwinder = ["read"]
# Implement `fallible_iterator::FallibleIterator` for the iterators.
fallible-iterator = ["dep:fallible-iterator"]

[dependencies]
fallible-iterator = { version = "0.3.0", default-features = false, optional = true }

[dev-dependencies]
object = { version = "0.36", default-features = false, features = ["read", "std"] }

[[example]]
name = "ehdump"
required-features = ["read"]

[[test]]
name = "elf_files"
required-features = ["read", "write"]

[[test]]
name = "llvm_oracle"
required-features = ["read", "write"]

[[test]]
name = "corpus"
required-features = ["write", "unwinder"]

[[test]]
name = "fuzz"
required-features = ["write", "unwinder"]

[[test]]
name = "unwinder"
required-features = ["write", "unwinder"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The format packs fields into 8-, 16- and 32-bit words, so narrowing casts
# are the norm; every value is range-checked or masked before it is cast.
cast_possible_truncation = "allow"
# Function-local `use UnwindInstruction::*` keeps the large instruction
# matches readable.
enum_glob_use = "allow"
